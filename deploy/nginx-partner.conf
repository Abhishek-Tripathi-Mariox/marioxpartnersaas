# Nginx site for partner.marioxsoftware.com → Next.js app on port 3000 (run by PM2).
#
#   sudo cp deploy/nginx-partner.conf /etc/nginx/sites-available/partner
#   sudo ln -s /etc/nginx/sites-available/partner /etc/nginx/sites-enabled/partner
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d partner.marioxsoftware.com     # adds HTTPS and the http→https redirect
#
# Certbot edits this file in /etc/nginx to add the 443 server block; keep this copy as the template.

server {
    listen 80;
    listen [::]:80;
    server_name partner.marioxsoftware.com;

    # Uploads go to S3 one file per request, max 15 MB each.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js build assets are content-hashed, so they can be cached for a long time.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
